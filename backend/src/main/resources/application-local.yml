# ============================================================
# local 环境 - 本地开发环境（无需公司内网/VPN）
# ============================================================
spring:
  redis:
    password:       # 本地 Redis 默认无密码，留空
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  datasource:
    url: jdbc:mysql://localhost:3306/yili_expert_resource_local?characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

# 本地环境开启更详细的 SQL 日志，方便调试
logging:
  level:
    com.yili.expert.resource.mapper: debug
