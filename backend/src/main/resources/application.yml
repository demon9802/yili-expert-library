# ============================================================
# 伊利专家资源库 V6 - Spring Boot 主配置
# 仅放公共配置项，环境相关配置见 application-{profile}.yml
# ============================================================
spring:
  profiles:
    active: @active.profile@
  application:
    name: yili-expert-resource
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

#【监控配置】
management:
  server:
    port: 5885     # 使用特殊端口，防止暴露公网
  endpoints:
    web:
      exposure:
        include: "health,metrics,httptrace,heapdump,threaddump,env,prometheus,info,loggers,beans"
    endpoint:
      health:
        show-details: ALWAYS
  metrics:
    # 下面选项建议打开，以监控 http 请求的 P99/P95 等，具体的时间分布可以根据实际情况设置
    distribution:
      sla:
        http:
          server:
            requests: 1ms,5ms,10ms,50ms,100ms,200ms,500ms,1s,5s
    # 在 Prometheus 中添加特别的 Labels
    tags:
      # 必须加上对应的应用名，因为需要以应用的维度来查看对应的监控
      application: ${spring.application.name}  # 或{项目名-应用名}，Prometheus通过此名称来筛选监控服务


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: yili-expert-resource-secret-key-2024-very-long-for-hmac-sha256
  expiration: 86400000

logging:
  level:
    com.yili.expert.resource: debug
    org.springframework.web: info
