function getDB() {

}

function saveDB(db) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

      if (!expert.qualDisplay || expert.qualDisplay.trim() === '') issues.push('缺少 qualDisplay');
      // Check for trailing semicolons in qualifications/courses
      if (expert.qualifications && /[;；]\s*$/.test(expert.qualifications.trim())) issues.push('qualifications 尾部含「；」');
      if (expert.courses && /[;；]\s*$/.test(expert.courses.trim())) issues.push('courses 尾部含「；」');
      
      detectedExperts.push({ name: rd.name, id: expert.id, issues: issues });
    }
  });
  
  var found = detectedExperts.filter(function(d) { return d.issues.length > 0; });
  if (found.length === 0) {
    el.innerHTML = '<span style="color:#10B981">✅ 全部 ' + detectedExperts.length + ' 位专家数据完整，无需修复！</span>';
    document.getElementById('btnPreview').disabled = true;
    document.getElementById('btnFix').disabled = true;
  } else {
    el.innerHTML = '<span style="color:#F59E0B">⚠️ 检测到 ' + found.length + ' 位专家存在数据问题：</span><br>' +
      found.map(function(d) { return '• ' + d.name + ' — ' + d.issues.join('，'); }).join('<br>');
    document.getElementById('btnPreview').disabled = false;
  }
  
  if (detectedExperts.length === 0) {
    el.innerHTML = '<span style="color:#EF4444">❌ 未找到匹配的专家。STORAGE_KEY: ' + STORAGE_KEY + '，专家总数: ' + (db.experts ? db.experts.length : 0) + '</span>';
    document.getElementById('btnPreview').disabled = true;
    document.getElementById('btnFix').disabled = true;
  }
}

function previewFix() {
  var db = getDB();
  if (!db) { alert('请先检测数据'); return; }
  if (detectedExperts.length === 0) { alert('未检测到需修复的专家，请先执行步骤1'); return; }
  
  var log = '📋 以下专家将被修复：\n\n';
  
  var fixableCount = 0;
  REPAIR_DATA.forEach(function(rd) {
    var expert = db.experts.find(function(e) { return e.name === rd.name; });
    if (!expert) return;
    
    var changes = [];
    if (!expert.advDisplay || expert.advDisplay.trim() === '') {
      changes.push('  advDisplay: 空 → "' + rd.advDisplay.replace(/\n/g, '\\n') + '"');
    }
    if (!expert.qualDisplay || expert.qualDisplay.trim() === '') {
      changes.push('  qualDisplay: 空 → "' + rd.qualDisplay.replace(/\n/g, '\\n') + '"');
    }
    if (expert.qualifications && /[;；]\s*$/.test(expert.qualifications.trim())) {
      changes.push('  qualifications: 清理尾部「；」');
    }
    if (expert.courses && /[;；]\s*$/.test(expert.courses.trim())) {
      changes.push('  courses: 清理尾部「；」');
    }
    
    if (changes.length > 0) {
      log += rd.name + '：\n' + changes.join('\n') + '\n\n';
      fixableCount++;
    }
  });
  
  if (fixableCount === 0) {
    log += '无需修复。';
    document.getElementById('btnFix').disabled = true;
  } else {
    log += '共 ' + fixableCount + ' 位专家将被修复。';
    document.getElementById('btnFix').disabled = false;
  }
  
  document.getElementById('previewResult').style.display = 'block';
  document.getElementById('previewResult').textContent = log;
}

function applyFix() {
  // Backup first
  var raw = localStorage.getItem(STORAGE_KEY);
  backupData = raw;
  
  var db = JSON.parse(raw);
  var fixedCount = 0;
  
  REPAIR_DATA.forEach(function(rd) {
    var expert = db.experts.find(function(e) { return e.name === rd.name; });
    if (!expert) return;
    
    var changed = false;
    
    if (!expert.advDisplay || expert.advDisplay.trim() === '') {
      expert.advDisplay = rd.advDisplay;
      changed = true;
    }
    if (!expert.qualDisplay || expert.qualDisplay.trim() === '') {
      expert.qualDisplay = rd.qualDisplay;
      changed = true;
    }
    // Clean trailing semicolons
    var cleanQual = expert.qualifications ? expert.qualifications.replace(/[;；]\s*$/, '').trim() : '';
    if (cleanQual !== (expert.qualifications || '').trim()) {
      expert.qualifications = cleanQual;
      changed = true;
    }
    var cleanCourses = expert.courses ? expert.courses.replace(/[;；]\s*$/, '').trim() : '';
    if (cleanCourses !== (expert.courses || '').trim()) {
      expert.courses = cleanCourses;
      changed = true;
    }
    
    if (changed) fixedCount++;
  });
  
  saveDB(db);
  
  var log = '✅ 修复完成！共修复 ' + fixedCount + ' 位专家。\n\n备份已保存，可点击「撤销修复」恢复。';
  document.getElementById('fixResult').style.display = 'block';
  document.getElementById('fixResult').textContent = log;
  document.getElementById('btnUndo').style.display = 'inline-block';
  document.getElementById('btnUndo').disabled = false;
  document.getElementById('btnFix').disabled = true;
  document.getElementById('refreshHint').style.display = 'block';
}

function undoFix() {
  if (!backupData) { alert('没有可撤销的备份'); return; }
  localStorage.setItem(STORAGE_KEY, backupData);
  document.getElementById('fixResult').style.display = 'block';
  document.getElementById('fixResult').textContent = '↩ 已撤销修复，数据已恢复。';
  document.getElementById('btnUndo').style.display = 'none';
  document.getElementById('btnFix').disabled = false;
  document.getElementById('refreshHint').style.display = 'none';
  backupData = null;
}
</script>
</body>
</html>
